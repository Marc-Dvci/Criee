<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criée</title>
  <meta name="description" content="Criée clears what small sellers have left at closing against people's standing wishes, and PayPal settles each match the moment it clears." />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1419; color: #edeae3;
           font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 520px; padding: 24px; text-align: center; }
    h1 { font-size: 34px; margin: 18px 0 6px; letter-spacing: -0.01em; }
    p { color: #c9c6be; margin: 6px 0; }
    a { color: #ffc23d; }
    .bar { width: 160px; height: 4px; margin: 22px auto 0; background: #26313c; border-radius: 4px; overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; background: #ffc23d; animation: run 1.1s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1e2730"/><rect x="10" y="14" width="44" height="16" rx="3" fill="#2b3640"/><rect x="10" y="34" width="44" height="16" rx="3" fill="#ffc23d"/><path d="M10 32h44" stroke="#0f1419" stroke-width="2"/></svg>
    <h1>Criée</h1>
    <p id="msg">Opening the live market…</p>
    <div class="bar" id="bar"><i></i></div>
    <p style="margin-top:22px;font-size:14px">Source code: <a href="https://github.com/Marc-Dvci/Criee">github.com/Marc-Dvci/Criee</a></p>
  </main>
  <script>
    const to = new URLSearchParams(location.search).get('to') || '/';
    fetch('https://criee-demo-416964654816.s3.amazonaws.com/current.json', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => { location.replace(d.url.replace(/\/$/, '') + (to.startsWith('/') ? to : '/')) })
      .catch(() => {
        document.getElementById('bar').remove()
        document.getElementById('msg').innerHTML = 'The live instance could not be reached. The README explains how to run Criée locally with <code>docker compose up</code>.'
      })
  </script>
</body>
</html>
