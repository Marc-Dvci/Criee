name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRIEE_HYPOTHESIS_EXAMPLES: '500'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install --no-deps -r requirements-toolkit.txt
      - name: Rules, generated invariants, consent, settlement, evidence and API
        run: python -m pytest -q

  judge-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install --no-deps -r requirements-toolkit.txt
      - run: npm ci
        working-directory: web
      - name: TypeScript and production build
        run: npm run build
        working-directory: web
      - run: python -m playwright install --with-deps chromium
      - name: Buyer, seller, sample photo, PayPal SDK contract and ledger in Chromium
        run: python scripts/judge_smoke.py
